name: Verify
on: [push, pull_request]

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/publication/guard.py history HEAD

  tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
